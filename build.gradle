plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    // Parchment
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// src/testmod (the smoke test's test mod) is still the NeoForge version from main and is not
// compiled on this branch yet.

loom {
    // Classes the login mixin needs to see (ServerLoginPacketListenerImpl$State)
    accessWidenerPath = file('src/main/resources/directauth.accesswidener')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            runDir 'run'
        }
        server {
            runDir 'run'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang names + Parchment parameter names: the same names main's NeoForge build uses, so the
    // mixins target the same members
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // SQLite driver, nested in the production jar (jar-in-jar)
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    include 'org.xerial:sqlite-jdbc:3.46.0.0'
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
