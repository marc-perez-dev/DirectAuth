plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    // Parchment
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Test mod for tools/smoke-test (src/testmod, mod id directauth_test): stands in for other mods.
// Built by testmodJar into build/testmod/, remapped to intermediary like the release jar; never
// part of the DirectAuth jar.
sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    // Classes the login mixin needs to see (ServerLoginPacketListenerImpl$State)
    accessWidenerPath = file('src/main/resources/directauth.accesswidener')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        directauth_test {
            sourceSet sourceSets.testmod
        }
    }

    runs {
        client {
            runDir 'run'
        }
        server {
            runDir 'run'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang names + Parchment parameter names: the same names main's NeoForge build uses, so the
    // mixins target the same members
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // SQLite driver, nested in the production jar (jar-in-jar)
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    include 'org.xerial:sqlite-jdbc:3.46.0.0'
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            // fabric-api: at least the version it is built against (without the "+1.21.1" build metadata)
            fabric_api_min_version: fabric_api_version.split('\\+')[0],
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = 21
}

java {
    withSourcesJar()
}

def testmodDevJar = tasks.register('testmodDevJar', Jar) {
    from sourceSets.testmod.output
    archiveBaseName = 'directauth_test'
    archiveVersion = '1.0.0'
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('testmod-dev')
}

// The test mod for the smoke test, remapped like the release jar: build/testmod/directauth_test-1.0.0.jar
tasks.register('testmodJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn testmodDevJar
    inputFile = testmodDevJar.flatMap { it.archiveFile }
    archiveBaseName = 'directauth_test'
    archiveVersion = '1.0.0'
    archiveClassifier = ''
    addNestedDependencies = false
    destinationDirectory = layout.buildDirectory.dir('testmod')
}

jar {
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
