# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true

# Mod Properties
mod_id=directauth
mod_name=DirectAuth
mod_license=MIT
mod_version=1.3.1
mod_group_id=com.marcp.directauth
mod_authors=marcp
# Descripción profesional en inglés (evitando "Premium")
mod_description=Secure authentication mod featuring asynchronous SQLite storage and optional automatic login for Online Mode (Premium) accounts.

# Fabric / Minecraft Properties (https://fabricmc.net/develop)
minecraft_version=1.21.1
loader_version=0.20.1
loom_version=1.17.21
fabric_api_version=0.116.17+1.21.1

# Mappings Properties: Mojang names + Parchment (the same names as the NeoForge build on main)
parchment_mappings_version=2024.07.28
parchment_minecraft_version=1.21
