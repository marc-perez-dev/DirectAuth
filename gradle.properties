# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true

# Mod Properties
mod_id=directauth
mod_name=DirectAuth
mod_license=MIT
mod_version=1.3.1
mod_group_id=com.marcp.directauth
mod_authors=marcp
# Descripción profesional en inglés (evitando "Premium")
mod_description=Secure authentication mod featuring asynchronous SQLite storage and optional automatic login for Online Mode (Premium) accounts.

# Forge / Minecraft Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.0
forge_version_range=[47.4.0,)
loader_version_range=[47,)

# Mappings Properties
parchment_mappings_version=2023.09.03
parchment_minecraft_version=1.20.1
