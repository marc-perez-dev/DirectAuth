pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    // La misma versión de Loom que DirectAuth (gradle.properties de la raíz). Loom no remapea una
    // mod hecha con un Loom más nuevo que él: mods.json fija versiones que cumplen esto
    def root = new Properties()
    file('../../gradle.properties').withInputStream { root.load(it) }
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version root.getProperty('loom_version')
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'directauth-mod-tests'
