plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

// Versiones de Minecraft, Fabric Loader, Fabric API y Parchment: las de DirectAuth
def root = new Properties()
file('../../gradle.properties').withInputStream { root.load(it) }

version = '1.0.0'
group = 'com.marcp.directauth.modtests'
base.archivesName = 'directauth_modtests'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${root.minecraft_version}"
    // Nombres de Mojang + Parchment, como DirectAuth
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${root.parchment_minecraft_version}:${root.parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${root.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${root.fabric_api_version}"

    // APIs de las mods probadas, solo para compilar: los jars que descarga run.js (en intermediary,
    // Loom los remapea a los nombres de Mojang) y sus jar-in-jar: mods en nested/ y librerías
    // normales (Kotlin...) en nested-libs/, que no se remapean
    modCompileOnly fileTree(dir: 'build/mod-cache', include: ['*.jar', 'nested/*.jar'])
    compileOnly fileTree(dir: 'build/mod-cache', include: ['nested-libs/*.jar'])
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand version: version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
